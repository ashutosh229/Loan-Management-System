services:
  mongo:
    image: mongo:7
    container_name: lms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: lms-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/lms
      JWT_SECRET: dev_only_seed_secret_change_me
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      MAX_UPLOAD_SIZE_MB: 5
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time. Uses localhost because
        # this URL is called from the evaluator's browser, not from inside
        # the Docker network.
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: lms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo-data:
  uploads-data:
